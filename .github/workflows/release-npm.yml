name: Release npm

on:
  push:
    # npm 制品独立号，使用专属 tag 前缀 npm-v*（如 npm-v1.0.4）。生态 JVM 制品占用
    # v*（v1.0.0 起逐版递增），若 npm 也用 v* 会与生态号撞 tag、npm 版本无法前进
    # （aster-lang-test#168）。release-maven.yml 只监听 v*，glob 从 tag 名首字符开始匹配，不会被
    # npm-v* 触发；平台 release-plan.json 的 test:npm.tagPrefix 与此保持一致。
    tags:
      - 'npm-v*'
  # orchestrator 入口（同 release-maven.yml 注释）：dispatch 创建本 npm artifact 版本的
  # npm-v tag、tag-push 走本 workflow 的 publish。
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的 npm 版本（不含 npm-v 前缀），须等于 packages/js/package.json 的 version'
        required: true
        type: string
      artifactIds:
        description: 'release-plan 的 artifact id 列表（逗号分隔，审计用，如 test:npm）'
        required: false
        type: string
      trainId:
        description: 'release train 标识（审计用）'
        required: false
        type: string
      forceTests:
        description: '发布 run 跑完整测试而不要求 main CI 已通过（ADR 0053 修订 A2 的逃生口）'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-npm-${{ github.repository }}-${{ inputs.version && format('npm-v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  create-tag:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          fetch-depth: 0
      - name: Create & push release tag
        env:
          VERSION: ${{ inputs.version }}
          FORCE_TESTS: ${{ inputs.forceTests }}
        run: |
          PKG_VERSION=$(node -p "require('./packages/js/package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::dispatch version ($VERSION) != packages/js/package.json version ($PKG_VERSION)"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags origin
          TAG="npm-v${VERSION}"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            TAG_SHA=$(git rev-list -n1 "$TAG"); HEAD_SHA=$(git rev-parse HEAD)
            if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
              # ADR 0053 修订 A2：tag 已在本 commit 上时 dispatch 是 no-op，tag 消息不会再变；本次要求 forceTests 而已有
              # tag 不带标记，就明确失败，不让 forceTests 被静默忽略。
              if [ "$FORCE_TESTS" = "true" ] && ! git cat-file -p "refs/tags/$TAG" | grep -qxF "release-gate: force-tests"; then
                echo "::error::$TAG 已存在但不带 force-tests 标记，本次 forceTests=true 不会生效。该版本尚未发布时：删除远端 tag（git push origin :refs/tags/$TAG）后重新 dispatch；或让 main CI 变绿后重跑该 tag 的 publish run。"; exit 1
              fi
              echo "::notice::$TAG already on this commit → no-op (idempotent)"; exit 0
            fi
            echo "::error::$TAG exists but points to $TAG_SHA, not HEAD $HEAD_SHA"; exit 1
          fi
          # ADR 0053 修订 A2：forceTests 时打 annotated tag，消息带标记，tag-push 的发布 run 据此跑完整测试。
          if [ "$FORCE_TESTS" = "true" ]; then
            git tag -a "$TAG" -m "release-gate: force-tests"
          else
            git tag "$TAG"
          fi
          git push origin "$TAG"

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/js
    permissions:
      # ADR 0053 修订 A2：main CI 门禁读本仓的 CI run 与 job。
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      # tag 前缀已与 JVM 分离（npm-v* / v*），本 gate 只防手工推了与 package.json
      # 不符的 npm-v tag：不符时 skip 而非 fail，不发布错误版本。gate 紧跟 checkout
      # （先于 node/pnpm setup），让 mismatch run 尽早结束。
      - name: Resolve publish gate (tag == this artifact's version?)
        id: gate
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#npm-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" = "$PKG_VERSION" ]; then
            echo "match=true" >> "$GITHUB_OUTPUT"
            echo "tag npm-v$TAG_VERSION matches npm package version $PKG_VERSION → publish"
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
            echo "::notice::tag npm-v$TAG_VERSION != npm package version $PKG_VERSION → skip npm publish"
          fi
      # ADR 0053 修订 A2：发布的 commit 必须已在 main CI 上通过，发布 run 不再重跑测试。
      # 必需 job 见 .github/main-ci-gate.json；tag 带「release-gate: force-tests」时门禁跳过、本 run 跑完整测试。
      - name: Require main CI green for this commit
        id: ci-gate
        if: steps.gate.outputs.match == 'true'
        uses: aster-cloud/aster-lang-platform/.github/actions/require-main-ci-green@main
        with:
          # 本 job 的 defaults.run 指向 packages/js；配置用绝对路径，不依赖 composite 步骤的工作目录。
          config: ${{ github.workspace }}/.github/main-ci-gate.json
      - if: steps.gate.outputs.match == 'true'
        uses: pnpm/action-setup@v6
        with: { version: 9 }
      - if: steps.gate.outputs.match == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - if: steps.gate.outputs.match == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.gate.outputs.match == 'true'
        run: pnpm build
      # force-tests：按 main CI 的 Build & test (Node) 跑一遍。
      - name: Test (force-tests only)
        if: steps.gate.outputs.match == 'true' && steps.ci-gate.outputs.force-tests == 'true'
        run: pnpm test
      - if: steps.gate.outputs.match == 'true'
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
