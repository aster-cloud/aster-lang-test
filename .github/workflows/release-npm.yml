name: Release npm

on:
  push:
    # npm 制品独立号，使用专属 tag 前缀 npm-v*（如 npm-v1.0.4）。生态 JVM 制品占用
    # v*（v1.0.0 起逐版递增），若 npm 也用 v* 会与生态号撞 tag、npm 版本无法前进
    # （aster-lang-test#168）。release-maven.yml 只监听 v*，glob 从 tag 名首字符开始匹配，不会被
    # npm-v* 触发；平台 release-plan.json 的 test:npm.tagPrefix 与此保持一致。
    tags:
      - 'npm-v*'
  # orchestrator 入口（同 release-maven.yml 注释）：dispatch 创建本 npm artifact 版本的
  # npm-v tag、tag-push 走本 workflow 的 publish。
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的 npm 版本（不含 npm-v 前缀），须等于 packages/js/package.json 的 version'
        required: true
        type: string
      artifactIds:
        description: 'release-plan 的 artifact id 列表（逗号分隔，审计用，如 test:npm）'
        required: false
        type: string
      trainId:
        description: 'release train 标识（审计用）'
        required: false
        type: string

concurrency:
  group: release-npm-${{ github.repository }}-${{ inputs.version && format('npm-v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  create-tag:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          fetch-depth: 0
      - name: Create & push release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          PKG_VERSION=$(node -p "require('./packages/js/package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::dispatch version ($VERSION) != packages/js/package.json version ($PKG_VERSION)"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags origin
          TAG="npm-v${VERSION}"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            TAG_SHA=$(git rev-list -n1 "$TAG"); HEAD_SHA=$(git rev-parse HEAD)
            if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
              echo "::notice::$TAG already on this commit → no-op (idempotent)"; exit 0
            fi
            echo "::error::$TAG exists but points to $TAG_SHA, not HEAD $HEAD_SHA"; exit 1
          fi
          git tag "$TAG"
          git push origin "$TAG"

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/js
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      # tag 前缀已与 JVM 分离（npm-v* / v*），本 gate 只防手工推了与 package.json
      # 不符的 npm-v tag：不符时 skip 而非 fail，不发布错误版本。gate 紧跟 checkout
      # （先于 node/pnpm setup），让 mismatch run 尽早结束。
      - name: Resolve publish gate (tag == this artifact's version?)
        id: gate
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#npm-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" = "$PKG_VERSION" ]; then
            echo "match=true" >> "$GITHUB_OUTPUT"
            echo "tag npm-v$TAG_VERSION matches npm package version $PKG_VERSION → publish"
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
            echo "::notice::tag npm-v$TAG_VERSION != npm package version $PKG_VERSION → skip npm publish"
          fi
      - if: steps.gate.outputs.match == 'true'
        uses: pnpm/action-setup@v6
        with: { version: 9 }
      - if: steps.gate.outputs.match == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - if: steps.gate.outputs.match == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.gate.outputs.match == 'true'
        run: pnpm build
      - if: steps.gate.outputs.match == 'true'
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
